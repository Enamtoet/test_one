<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&family=Playfair+Display:ital,wght@1,700&family=Cairo:wght@800;900&family=Poppins:wght@800&display=swap" rel="stylesheet">
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 body{background:#000}
 .av{width:1080px;height:1080px;position:relative;overflow:hidden}
 svg{position:absolute;inset:0}
</style></head><body>

<!-- 1. Stickman: figure with two speech bubbles (Arabic -> Italian) -->
<div class="av" id="a1" style="background:#000">
<svg viewBox="0 0 1080 1080">
  <g fill="#fff">
    <circle cx="390" cy="560" r="62"/>
    <path d="M310 860 L310 690 Q310 625 390 625 Q470 625 470 690 L470 860 Z"/>
  </g>
  <line x1="200" y1="862" x2="880" y2="862" stroke="#fff" stroke-width="6"/>
  <!-- arabic bubble -->
  <g transform="translate(470,250)"><rect width="330" height="140" rx="70" fill="none" stroke="#fff" stroke-width="10"/>
    <path d="M60 140 l-14 46 l56 -46" fill="#000" stroke="#fff" stroke-width="10" stroke-linejoin="round"/><rect x="50" y="132" width="60" height="16" fill="#000"/>
    <text x="165" y="96" fill="#fff" font-family="Cairo" font-weight="900" font-size="74" text-anchor="middle">مرحبا</text></g>
  <!-- italian bubble -->
  <g transform="translate(520,450)"><rect width="300" height="140" rx="70" fill="#fff"/>
    <path d="M50 140 l-14 46 l56 -46" fill="#fff"/>
    <text x="150" y="98" fill="#000" font-family="Poppins" font-weight="800" font-size="76" text-anchor="middle">Ciao!</text></g>
  <g transform="translate(600,620)"><rect width="46" height="12" fill="#009246"/><rect x="46" width="46" height="12" fill="#fff"/><rect x="92" width="46" height="12" fill="#CE2B37"/></g>
</svg></div>

<!-- 2. Cinematic monogram -->
<div class="av" id="a2" style="background:radial-gradient(circle at 50% 42%,#2a2620 0%,#0b0b0d 62%)">
<svg viewBox="0 0 1080 1080">
  <text x="540" y="600" fill="#F4F1EA" font-family="Playfair Display" font-style="italic" font-weight="700" font-size="360" text-anchor="middle">Ciao</text>
  <g transform="translate(400,660)"><rect width="93" height="12" fill="#009246"/><rect x="93" width="94" height="12" fill="#F4F1EA"/><rect x="187" width="93" height="12" fill="#CE2B37"/></g>
  <text x="540" y="800" fill="#D9B26A" font-family="Cairo" font-weight="800" font-size="88" text-anchor="middle">تعلّم الإيطالية</text>
</svg></div>
