<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0}body{background:#000}.av{width:1080px;height:1080px;position:relative;overflow:hidden}svg{position:absolute;inset:0}</style>
</head><body>
<!-- 1. black stickman-style timer -->
<div class="av" id="b1" style="background:#000"><svg viewBox="0 0 1080 1080">
  <circle cx="540" cy="500" r="290" fill="none" stroke="#2a2a2a" stroke-width="34"/>
  <circle cx="540" cy="500" r="290" fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round"
          stroke-dasharray="1822" stroke-dashoffset="364" transform="rotate(-90 540 500)"/>
  <text x="540" y="590" fill="#fff" font-family="Inter" font-weight="900" font-size="280" text-anchor="middle" letter-spacing="-8">5'</text>
  <text x="540" y="890" fill="#fff" font-family="Inter" font-weight="800" font-size="62" text-anchor="middle" letter-spacing="10">ENGLISH</text>
  <g transform="translate(450,915)"><rect width="60" height="10" fill="#012169"/><rect x="60" width="60" height="10" fill="#fff"/><rect x="120" width="60" height="10" fill="#C8102E"/></g>
</svg></div>

<!-- 2. navy + red: timer with speech bubble -->
<div class="av" id="b2" style="background:#012169"><svg viewBox="0 0 1080 1080">
  <circle cx="540" cy="540" r="330" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="36"/>
  <circle cx="540" cy="540" r="330" fill="none" stroke="#C8102E" stroke-width="36" stroke-linecap="round"
          stroke-dasharray="2073" stroke-dashoffset="415" transform="rotate(-90 540 540)"/>
  <g transform="translate(330,360)"><rect width="420" height="250" rx="125" fill="#fff"/>
    <path d="M90 250 l-24 80 l96 -80" fill="#fff"/>
    <text x="210" y="170" fill="#012169" font-family="Inter" font-weight="900" font-size="150" text-anchor="middle">Hi!</text></g>
  <text x="540" y="780" fill="#fff" font-family="Inter" font-weight="900" font-size="96" text-anchor="middle">5 min</text>
</svg></div>

<!-- 3. cinematic wordmark -->
<div class="av" id="b3" style="background:radial-gradient(circle at 50% 40%,#22262f 0%,#0b0b0d 65%)"><svg viewBox="0 0 1080 1080">
  <text x="540" y="560" fill="#F4F1EA" font-family="Playfair Display" font-style="italic" font-weight="700" font-size="250" text-anchor="middle">cinque</text>
  <text x="540" y="740" fill="#F4F1EA" font-family="Playfair Display" font-style="italic" font-weight="700" font-size="250" text-anchor="middle">minuti</text>
  <g transform="translate(400,790)"><rect width="93" height="12" fill="#012169"/><rect x="93" width="94" height="12" fill="#F4F1EA"/><rect x="187" width="93" height="12" fill="#C8102E"/></g>
  <text x="540" y="880" fill="#9DB4E6" font-family="Inter" font-weight="800" font-size="46" text-anchor="middle" letter-spacing="14">OF ENGLISH</text>
</svg></div>
</body></html>
