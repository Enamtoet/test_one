<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>3 Mistakes</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0B0B0D; --fg:#F4F1EA; --mute:#8D8A84; --green:#2BB673; --red:#E5484D; --gold:#D9B26A; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:var(--bg); }
  body { font-family:'IBM Plex Sans Arabic',sans-serif; color:var(--fg); position:relative; }
  .lat { font-family:'Inter',sans-serif; direction:ltr; unicode-bidi:isolate; }
  .serif { font-family:'Playfair Display',serif; direction:ltr; unicode-bidi:isolate; }

  #light { position:absolute; width:1400px; height:1400px; left:-160px; top:220px; border-radius:50%;
           background:radial-gradient(circle, rgba(217,178,106,.13) 0%, rgba(217,178,106,0) 60%); }
  #vignette { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,.75) 100%); }
  #grain { position:absolute; inset:0; width:1080px; height:1920px; opacity:.07; mix-blend-mode:screen; }

  /* top bar */
  #top { position:absolute; top:120px; left:90px; right:90px; display:flex; justify-content:space-between; align-items:center; direction:ltr; }
  #brand { font-family:'Inter'; font-weight:600; font-size:30px; letter-spacing:10px; color:var(--fg); }
  #brand i { font-style:normal; color:var(--gold); }
  #flagline { display:flex; width:120px; height:6px; }
  #flagline div { flex:1; }
  #counter { font-family:'Inter'; font-weight:500; font-size:30px; letter-spacing:6px; color:var(--mute); }
  #bar { position:absolute; bottom:250px; left:90px; right:90px; height:4px; background:rgba(244,241,234,.12); direction:ltr; }
  #bar div { height:100%; background:var(--fg); width:0; }

  .scene { position:absolute; inset:0; padding:0 90px 200px; display:flex; flex-direction:column; justify-content:center; opacity:0; }
  .mask { overflow:hidden; padding-bottom:.08em; }
  .mask > * { display:block; }

  /* hook */
  #hook .eyebrow { font-family:'Inter'; font-weight:500; font-size:32px; letter-spacing:12px; color:var(--gold); direction:ltr; text-align:right; }
  #hook .n { font-family:'Playfair Display'; font-weight:700; font-size:520px; line-height:.9; direction:ltr; text-align:right; margin-top:10px; }
  #hook .t1 { font-weight:700; font-size:118px; line-height:1.15; margin-top:10px; }
  #hook .t2 { font-weight:300; font-size:76px; line-height:1.3; color:var(--mute); margin-top:24px; }
  #hook .rule { height:3px; background:var(--gold); margin-top:60px; width:0; }

  /* mistake scenes */
  .num { display:flex; align-items:baseline; gap:30px; }
  .num .d { font-family:'Playfair Display'; font-style:italic; font-weight:500; font-size:150px; color:var(--gold); direction:ltr; line-height:1; }
  .num .l { font-weight:500; font-size:46px; color:var(--mute); }
  .blk { margin-top:90px; }
  .tag { font-weight:600; font-size:38px; letter-spacing:2px; display:flex; align-items:center; gap:18px; }
  .tag .dot { width:18px; height:18px; border-radius:50%; }
  .wrong .tag { color:var(--red); } .wrong .tag .dot { background:var(--red); }
  .right .tag { color:var(--green); } .right .tag .dot { background:var(--green); }
  .phrase { font-family:'Playfair Display'; font-weight:700; font-size:136px; line-height:1.1; margin-top:22px;
            direction:ltr; text-align:right; position:relative; display:inline-block; align-self:flex-start; white-space:nowrap; }
  .wrong .phrase { color:var(--mute); }
  .strike { position:absolute; left:-10px; top:54%; height:10px; background:var(--red); width:0; border-radius:6px; }
  .uline { position:absolute; left:0; bottom:-6px; height:10px; background:var(--green); width:0; border-radius:6px; }
  .mean { font-weight:400; font-size:54px; line-height:1.5; margin-top:18px; color:var(--fg); }
  .mean b { font-weight:700; }
  .wrong .mean { color:#BDB9B1; }
  .sep { height:2px; background:rgba(244,241,234,.14); margin-top:80px; width:0; }
  .tip { margin-top:80px; font-weight:400; font-size:42px; line-height:1.55; color:var(--mute); border-right:4px solid var(--gold); padding-right:30px; }
  .tip .serif { color:var(--fg); font-style:italic; }

  /* outro */
  #outro .eyebrow { font-family:'Inter'; font-weight:500; font-size:32px; letter-spacing:12px; color:var(--gold); direction:ltr; text-align:right; }
  #outro .q { font-weight:700; font-size:100px; line-height:1.25; margin-top:40px; }
  #outro .opts { display:flex; gap:30px; margin-top:70px; direction:ltr; justify-content:flex-end; }
  #outro .opt { width:170px; height:170px; border:3px solid rgba(244,241,234,.35); border-radius:50%; display:flex; align-items:center; justify-content:center;
                font-family:'Playfair Display'; font-style:italic; font-size:84px; }
  #outro .s { font-weight:400; font-size:50px; color:var(--mute); margin-top:110px; line-height:1.6; }
  #outro .s b { color:var(--fg); font-weight:600; }
</style>
</head>
<body>
<div id="light"></div>
<canvas id="grain" width="540" height="960"></canvas>
<div id="vignette"></div>

<div id="top">
  <div id="brand">IMPARA<i>·</i>ITALIANO</div>
  <div id="flagline"><div style="background:#009246"></div><div style="background:#F4F1EA"></div><div style="background:#CE2B37"></div></div>
  <div id="counter"></div>
</div>
<div id="bar"><div></div></div>

<div class="scene" id="hook">
  <div class="mask"><div class="eyebrow" data-a="0.15">LEZIONE 01</div></div>
  <div class="mask"><div class="n" data-a="0.35">3</div></div>
  <div class="mask"><div class="t1" data-a="0.8">أخطاء يقع فيها</div></div>
  <div class="mask"><div class="t1" data-a="1.0">كل العرب</div></div>
  <div class="mask"><div class="t2" data-a="1.5">في اللغة الإيطالية</div></div>
  <div class="rule" data-w="1.9"></div>
</div>

<div id="mistakes"></div>

<div class="scene" id="outro">
  <div class="mask"><div class="eyebrow" data-a="0.1">LA TUA RISPOSTA</div></div>
  <div class="mask"><div class="q" data-a="0.35">أيّ خطأ كنت</div></div>
  <div class="mask"><div class="q" data-a="0.55" style="margin-top:0">تقع فيه؟</div></div>
  <div class="opts">
    <div class="mask"><div class="opt" data-a="1.0">1</div></div>
    <div class="mask"><div class="opt" data-a="1.15">2</div></div>
    <div class="mask"><div class="opt" data-a="1.3">3</div></div>
  </div>
  <div class="mask"><div class="s" data-a="1.9">اكتب الرقم في التعليقات<br><b>واحفظ الفيديو للمراجعة</b></div></div>
</div>

<script>
const M = [
  { w:'Sono caldo',      wm:'تعني: <b>أنا مثير</b>… وليس ما تقصده',
    r:'Ho caldo',        rm:'أشعر <b>بالحر</b>',
    tip:'للإحساس نستخدم <span class="serif">avere</span> وليس <span class="serif">essere</span>' },
  { w:'Voglio un caffè', wm:'«أريد قهوة» — تبدو <b>أمراً وقحاً</b>',
    r:'Vorrei un caffè', rm:'«أودّ قهوة» — <b>مهذّبة</b> ومحترمة',
    tip:'في المقهى والمحلات قل دائماً <span class="serif">Vorrei…</span>' },
  { w:'Sono 25 anni',    wm:'حرفياً: «أنا 25 سنة» — <b>خطأ</b>',
    r:'Ho 25 anni',      rm:'عمري <b>25</b> سنة',
    tip:'الإيطاليون «يملكون» العمر: <span class="serif">Quanti anni hai?</span>' },
];
const LBL = ['الخطأ الأول','الخطأ الثاني','الخطأ الثالث'];
const box = document.getElementById('mistakes');
M.forEach((m, i) => {
  const s = document.createElement('div'); s.className = 'scene mistake';
  s.innerHTML = `
    <div class="num"><div class="mask"><div class="d" data-a="0.1">0${i+1}</div></div><div class="mask"><div class="l" data-a="0.3">${LBL[i]}</div></div></div>
    <div class="blk wrong">
      <div class="mask"><div class="tag" data-a="0.6"><span class="dot"></span>لا تقل</div></div>
      <div class="mask" style="display:flex"><div class="phrase" data-a="0.8">${m.w}<span class="strike" data-w="1.7"></span></div></div>
      <div class="mask"><div class="mean" data-a="2.1">${m.wm}</div></div>
    </div>
    <div class="sep" data-w="2.9"></div>
    <div class="blk right" style="margin-top:80px">
      <div class="mask"><div class="tag" data-a="3.2"><span class="dot"></span>قل</div></div>
      <div class="mask" style="display:flex"><div class="phrase" data-a="3.4">${m.r}<span class="uline" data-w="4.0"></span></div></div>
      <div class="mask"><div class="mean" data-a="4.4">${m.rm}</div></div>
    </div>
    <div class="mask"><div class="tip" data-a="5.4">${m.tip}</div></div>`;
  box.appendChild(s);
});

// timeline
const HOOK = 3.4, MIS = 8.6, OUT = 5.2;
const scenes = [['hook', 0, HOOK]];
document.querySelectorAll('.mistake').forEach((s, i) => { s.id = 'm' + i; scenes.push(['m' + i, HOOK + i*MIS, MIS]); });
scenes.push(['outro', HOOK + 3*MIS, OUT + 1]);
const TOTAL = HOOK + 3*MIS + OUT;
window.TOTAL = TOTAL;
window.TIMELINE = { HOOK, MIS, OUT, TOTAL };

const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const ease = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;   // easeInOutCubic
const eOut = x => 1 - Math.pow(1 - x, 4);

// deterministic film grain
const g = document.getElementById('grain').getContext('2d');
const img = g.createImageData(540, 960);
function grain(frame) {
  let s = (frame * 2654435761) >>> 0;
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0;
    const v = s & 255; d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255;
  }
  g.putImageData(img, 0, 0);
}

let fitted = false;
function fit() {
  document.querySelectorAll('.phrase').forEach(el => {
    let fs = 136;
    el.style.fontSize = fs + 'px';
    while (el.getBoundingClientRect().width > 880 && fs > 60) { fs -= 2; el.style.fontSize = fs + 'px'; }
  });
  // same size for the wrong/right pair in a scene so they line up
  document.querySelectorAll('.mistake').forEach(sc => {
    const ps = [...sc.querySelectorAll('.phrase')];
    const m = Math.min(...ps.map(p => parseFloat(p.style.fontSize)));
    ps.forEach(p => p.style.fontSize = m + 'px');
  });
  fitted = true;
}
document.fonts.ready.then(fit);
window.render = function (t) {
  for (const [id, s, d] of scenes) {
    const el = document.getElementById(id), local = t - s;
    if (local < 0 || local > d) { el.style.opacity = 0; continue; }
    const out = clamp((d - local) / 0.45);
    el.style.opacity = ease(out);
    el.style.filter = out < 1 ? `blur(${(1 - out) * 14}px)` : '';
    el.querySelectorAll('[data-a]').forEach(x => {
      const p = eOut(clamp((local - +x.dataset.a) / 0.7));
      x.style.transform = `translateY(${(1 - p) * 105}%)`;
    });
    el.querySelectorAll('[data-w]').forEach(x => {
      const p = ease(clamp((local - +x.dataset.w) / 0.55));
      x.style.width = x.classList.contains('strike') ? `calc(${p * 100}% + ${p * 20}px)` : (p * 100) + '%';
    });
  }
  // counter + progress
  const mi = Math.floor((t - HOOK) / MIS);
  document.getElementById('counter').textContent = (t >= HOOK && mi < 3) ? `0${mi + 1} / 03` : '';
  document.querySelector('#bar div').style.width = (100 * t / TOTAL) + '%';
  document.getElementById('light').style.transform = `translate(${Math.sin(t * .35) * 140}px, ${Math.cos(t * .27) * 220}px)`;
  grain(Math.round(t * 30));
};
render(0);
</script>
</body>
</html>
